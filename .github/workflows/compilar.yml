# Compila o Retro Computer para Windows, macOS e Linux (PC e ARM64, como o Raspberry Pi) a cada push.
# Os instaladores ficam nos "Artifacts" da execução (aba Actions do GitHub).
# O fluxo "Publicar" (publicar.yml) chama este mesmo fluxo e põe os instaladores num lançamento.
name: Compilar

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      GOOGLE_CALENDAR_CLIENT_JSON:
        required: false

permissions:
  contents: read

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: os pacotes do Linux para ARM64 (Raspberry Pi 3, 4 e 5, com o sistema de 64 bits).
        include:
          - os: ubuntu-latest
            argumentos: --linux --x64
          - os: ubuntu-24.04-arm
            argumentos: --linux --arm64
          - os: windows-latest
            argumentos: --win --x64
          # Cada Mac compila e abre sua própria arquitetura, inclusive o node-pty.
          - os: macos-latest
            argumentos: --mac --arm64
          - os: macos-15-intel
            argumentos: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # O código não guarda o token do GitHub no .git (os scripts de instalação das dependências rodam depois).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Testes (disco, idiomas e atualizações)
        run: npm test

      - name: Programas reais do Windows por atalho direto e por lançador
        if: runner.os == 'Windows'
        run: node --test testes/janelas-reais.cjs

      - name: Guardar as capturas dos programas reais do Windows
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: janelas-reais-Windows
          path: capturas-janelas-reais/*.png
          if-no-files-found: ignore

      - name: Instalar o Codex no Windows PowerShell e conferir o executável real
        if: runner.os == 'Windows'
        # O mesmo Windows PowerShell 5.1 usado no Prompt, sem depender do pwsh 7 do runner.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers
          }
          $env:RETRO_PATH_ANTES_CODEX = $env:PATH
          $comando = node -p "require('./src/principal/codex').comandoInstalarCodex()"
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível obter o comando do aplicativo.' }
          Invoke-Expression ($comando + ' --accept-source-agreements --accept-package-agreements --disable-interactivity')
          if ($LASTEXITCODE -ne 0) { throw 'A instalação real do Codex falhou.' }
          node testes/codex-instalado.cjs
          if ($LASTEXITCODE -ne 0) { throw 'O Codex instalado não foi encontrado ou não executou.' }

      - name: Conferir as seis linguagens do laboratório
        if: matrix.os == 'ubuntu-latest'
        run: |
          node -e 'const { LaboratorioProgramacao, LINGUAGENS } = require("./src/principal/laboratorio"); (async () => { for (const l of Object.keys(LINGUAGENS)) { if (!await new LaboratorioProgramacao().detectar(l)) throw new Error("Ferramenta ausente: " + l); } })().catch(e => { console.error(e); process.exitCode = 1; });'

      - name: Teste da área de trabalho (com capturas)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas geral
          RETRO_IDIOMA=en xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/en geral
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas breakout
          RETRO_IDIOMA=en xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/en breakout
          RETRO_IDIOMA=es xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/es breakout
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas laboratorio
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas codex
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas codexInstalar
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas mascotes
          RETRO_IDIOMA=en xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/en mascotes
          RETRO_IDIOMA=es xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/es mascotes
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas googleAgenda
          RETRO_IDIOMA=en xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/en googleAgenda
          RETRO_IDIOMA=es xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/es googleAgenda
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas integracao
          RETRO_IDIOMA=en xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/en integracao
          RETRO_IDIOMA=es xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/es integracao
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas integracaoMac
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas integracaoWeb
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas integracaoElevada
          xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas novos
          RETRO_IDIOMA=en xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/en novos
          RETRO_IDIOMA=es xvfb-run -a -s "-screen 0 1280x800x24" node testes/capturas.mjs capturas/es novos

      - name: Guardar as capturas
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/**/*.png
          if-no-files-found: ignore

      # As duas telas em tela cheia no Windows de verdade, com dois monitores de mentira: a tela cheia do
      # Chromium devolvia a janela a um monitor só (ESPALHAR_SEM_CHEIA em main.js).
      - name: Teste das duas telas no Windows
        if: matrix.os == 'windows-latest'
        run: node testes/duas-telas.mjs capturas-duas-telas

      - name: Guardar as capturas das duas telas
        if: matrix.os == 'windows-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-duas-telas
          path: capturas-duas-telas/*.png
          if-no-files-found: ignore

      - name: Preparar a conexão Google do aplicativo, se configurada
        run: node ferramentas/preparar-google.cjs
        env:
          GOOGLE_CALENDAR_CLIENT_JSON: ${{ secrets.GOOGLE_CALENDAR_CLIENT_JSON }}

      - name: Gerar os instaladores
        run: npx electron-builder ${{ matrix.argumentos }} --publish never
        env:
          # Sem certificados: no Mac, apenas assinatura ad hoc (mac.identity), sem notarização.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # A assinatura ad hoc não usa credenciais e deve ser conferida também nas PRs.
          CSC_FOR_PULL_REQUEST: "true"

      - name: Conferir e abrir o aplicativo do Mac empacotado
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_ARCH" = "ARM64" ]; then pasta="dist/mac-arm64"; else pasta="dist/mac"; fi
          codesign --verify --deep --strict --verbose=2 "$pasta/Retro Computer.app"
          export RETRO_EXECUTAVEL="$PWD/$pasta/Retro Computer.app/Contents/MacOS/Retro Computer"
          node testes/capturas.mjs capturas-mac breakout
          node testes/capturas.mjs capturas-mac laboratorio
          node testes/capturas.mjs capturas-mac codex
          node testes/capturas.mjs capturas-mac mascotes
          node testes/capturas.mjs capturas-mac googleAgenda
          node testes/capturas.mjs capturas-mac integracaoMac
          node testes/capturas.mjs capturas-mac integracaoWeb

      - name: Testar o Codex no aplicativo do Windows empacotado
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RETRO_EXECUTAVEL = Join-Path $PWD 'dist/win-unpacked/Retro Computer.exe'
          node testes/capturas.mjs capturas-codex breakout
          node testes/capturas.mjs capturas-codex codex
          node testes/capturas.mjs capturas-codex codexInstalar
          node testes/capturas.mjs capturas-codex mascotes
          node testes/capturas.mjs capturas-codex googleAgenda
          node testes/capturas.mjs capturas-codex integracaoReal
          node testes/capturas.mjs capturas-codex integracaoChrome

      - name: Guardar as capturas do Codex no Windows
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-codex-Windows
          path: capturas-codex/**
          if-no-files-found: ignore

      - name: Guardar a captura do aplicativo do Mac
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-mac-${{ runner.arch }}
          path: capturas-mac/**
          if-no-files-found: ignore

      - name: Guardar os instaladores
        uses: actions/upload-artifact@v4
        with:
          name: retro-computer-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: warn
