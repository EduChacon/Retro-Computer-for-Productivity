<!doctype html>
<!--
  O emulador do DOS (o DOSBox do js-dos), servido em dos://emulador num quadro isolado da área de
  trabalho (src/principal/dos.js): sem a ponte com o processo principal e sem internet. A janela
  do DOS (src/sistema/js/apps/dos.js) conversa com ele só por mensagens.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; outline: none; image-rendering: pixelated; touch-action: none; }
</style>
</head>
<body>
<canvas id="tela" width="640" height="400" tabindex="0"></canvas>
<script src="emulators.js"></script>
<script src="emulador.js"></script>
</body>
</html>
